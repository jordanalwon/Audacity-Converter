[project]
name = "audacity-converter"
version = "0.3.0"
description = "Extract data from Audacity Project file (.aup3)"
readme = "README.md"
authors = [
    { name = "Jordan Alwon", email = "jordan.alwon@idmt.fraunhofer.de" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "soundfile>=0.13.1",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
